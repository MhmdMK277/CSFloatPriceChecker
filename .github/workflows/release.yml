name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: CSFloatTracker-Windows.exe
          - os: ubuntu-latest
            artifact: CSFloatTracker-Linux
          - os: macos-latest
            artifact: CSFloatTracker-macOS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend + desktop extras
        run: pip install -e ".[desktop]"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build executable
        run: python scripts/build_desktop.py --skip-frontend

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/CSFloatTracker-Windows.exe
            artifacts/CSFloatTracker-Linux
            artifacts/CSFloatTracker-macOS
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
